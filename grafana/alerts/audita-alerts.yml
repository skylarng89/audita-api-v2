# Audita v2 — alert rules (Sprint 6, Task 6.4)
# Loaded by Prometheus (rule_files) or Grafana unified alerting.
groups:
  - name: audita-critical
    interval: 1m
    rules:
      - alert: AuditChainTamperingDetected
        expr: audit_chain_verify_duration_seconds_count{status="failed"} > 0
        for: 1m
        labels:
          severity: P0
        annotations:
          summary: "Audit hash-chain verification failed — possible tampering"
          description: "The scheduled integrity verifier reported a broken chain. Treat as a compliance incident."

      - alert: NATSConsumerLagHigh
        expr: nats_consumer_lag > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "NATS consumer lag > 1000 for {{ $labels.consumer }}"
          description: "Events are backing up; notifications and audit rows are delayed."

      - alert: SLAScanFailures
        expr: increase(audit_chain_verify_duration_seconds_count{job=\"audita-api\"}[15m]) == 0 and on() hour() >= 9 < 17
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Background jobs stalled during business hours"
          description: "SLA/audit jobs appear to have stopped producing metrics."

      - alert: WebSocketErrorSpike
        expr: rate(http_request_duration_seconds_count{route=\"/api/v1/notifications/stream\", status=~\"5..\"}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "WebSocket upgrade errors spiking"
          description: "Clients are failing to connect to the notification stream."

      - alert: APIHighErrorRate
        expr: sum(rate(http_request_duration_seconds_count{status=~\"5..\"}[5m])) / sum(rate(http_request_duration_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API 5xx rate above 5%"
