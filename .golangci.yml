version: "2"

# golangci-lint config (blueprint Sprint 0, Task 0.6):
# depguard enforces the module-boundary rule — bounded-context packages may
# only import each other's published port surfaces, never sibling internals.
run:
  timeout: 5m

linters:
  default: standard
  enable:
    - depguard # import-boundary enforcement (ADR-1)
    - revive # idiomatic Go
    - govet
    - staticcheck
    - errcheck
    - bodyclose # SQL rows must be closed
    - sqlclosecheck
    - rowserrcheck
    - noctx # HTTP requests must carry context
    - misspell
    - unconvert
    - unparam
    - copyloopvar

linters-settings:
  depguard:
    rules:
      # Bounded contexts must not import each other's internals directly.
      # Cross-module communication happens via NATS events (FR-4) or the
      # module's exported port types. platform/* shared infra is allowed.
      bounded-contexts:
        list-mode: strict
        files:
          - "**/internal/identity/**/*.go"
          - "**/internal/tenancy/**/*.go"
          - "**/internal/changerequest/**/*.go"
          - "**/internal/collaboration/**/*.go"
          - "**/internal/audit/**/*.go"
          - "**/internal/notification/**/*.go"
        deny:
          - pkg: "github.com/audita/audita-api/internal/identity/store"
            desc: "import sibling module internals; publish a port interface instead (ADR-1)"
          - pkg: "github.com/audita/audita-api/internal/changerequest/store"
            desc: "import sibling module internals; publish a port interface instead (ADR-1)"
          - pkg: "github.com/audita/audita-api/internal/collaboration/store"
            desc: "import sibling module internals; publish a port interface instead (ADR-1)"
          - pkg: "github.com/audita/audita-api/internal/audit/store"
            desc: "import sibling module internals; publish a port interface instead (ADR-1)"
          - pkg: "github.com/audita/audita-api/internal/notification/store"
            desc: "import sibling module internals; publish a port interface instead (ADR-1)"

  revive:
    rules:
      - name: package-comments
      - name: exported
      - name: error-return
      - name: var-naming
      - name: context-as-argument

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Tests may relax some checks.
    - path: _test\.go
      linters:
        - errcheck
        - dupl
