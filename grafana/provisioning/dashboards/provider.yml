# Audita v2 — dashboard provisioning (Sprint 6, Task 6.4)
apiVersion: 1

providers:
  - name: audita-dashboards
    orgId: 1
    folder: Audita
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
